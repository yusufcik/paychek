<style>
:root{--bg:#fff;--card:#eef1f4;--ink:#111;--mute:#7b8591;--green:#16a34a;--blue:#eaf4fd;--sec:#f1f3f5;--line:#e6e9ec;--out:#e7eaee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;background:var(--out);color:var(--ink);display:flex;justify-content:center}
.phone{width:100%;max-width:430px;height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
main{flex:1;overflow-y:auto;padding:0 14px 16px}
h1{font-size:26px;font-weight:600;padding:18px 0 14px;display:flex;justify-content:space-between;align-items:center}
.ic{width:26px;height:26px;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.svc{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:26px;padding:20px 18px;margin-bottom:10px;position:relative;overflow:hidden;cursor:pointer}
.svc .dot{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:20px;color:#fff;font-weight:700}
.svc b{display:block;font-size:19px;font-weight:500;margin-bottom:4px}
.svc span{font-size:15px;color:var(--mute);line-height:1.35}
.svc .ch{margin-left:auto;flex:none}
.new{position:absolute;left:-26px;top:12px;background:var(--green);color:#fff;font-size:10px;font-weight:700;padding:3px 30px;transform:rotate(-45deg)}
.month{display:flex;align-items:center;gap:22px;font-size:22px;font-weight:500;padding:6px 4px 14px}
.chips{display:flex;gap:8px;margin-bottom:14px}
.chip{border:0;background:var(--card);color:var(--mute);font:inherit;font-size:16px;padding:12px 22px;border-radius:30px;cursor:pointer}
.chip.f{padding:12px 16px}.chip.on{background:var(--green);color:#fff}
.sum{background:var(--bg);box-shadow:0 2px 14px rgba(0,0,0,.08);border:1px solid var(--line);border-radius:20px;padding:14px 18px;margin-bottom:14px}
.sum small{font-size:15px;color:var(--mute)}.sum div{font-size:30px;font-weight:600}.sum em{font-style:normal;font-size:20px;font-weight:400;color:var(--mute)}
.mon{background:var(--blue);border-radius:22px;padding:16px 18px;margin-bottom:12px}
.mon p{font-size:15px;line-height:1.4;margin:8px 0 14px}
.mon .r{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:600}
.btn{background:var(--green);color:#fff;border:0;border-radius:30px;font:inherit;font-size:20px;padding:12px 34px;cursor:pointer}
.day{background:var(--sec);margin:0 -14px;padding:8px 14px;font-size:15px;color:var(--mute)}
.tx{display:flex;align-items:center;gap:12px;padding:14px 0}
.tx .a{width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;background:#0b2d8c}
.tx .a.g{background:var(--green);font-size:22px}.tx .a.i{background:var(--card);color:var(--green);font-size:22px}
.tx .t{flex:1;min-width:0}.tx b{display:block;font-size:18px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t span{font-size:15px;color:var(--mute)}
.tx .s{text-align:right;font-size:18px;font-weight:500}.tx .s i{display:block;font-style:normal;font-size:16px;font-weight:400;margin-top:2px}
.pos{color:var(--green)}
.cols{display:flex;gap:12px}.col{flex:1;display:flex;flex-direction:column;gap:12px}
.tile{border-radius:24px;padding:16px;font-size:20px;font-weight:500;line-height:1.2;position:relative;overflow:hidden;cursor:pointer;background:var(--card)}
.tile.big{padding-bottom:0}.tile .em{display:block;font-size:84px;line-height:1;margin:8px 0 14px;filter:saturate(.8)}
.y{background:#fcecd0;color:#111}.bl{background:#d3e8fc;color:#111}.gr{background:#d4f1e2;color:#111}.pk{background:#fbdcdc;color:#111}.pu{background:#f4ecfd;color:#111}
.tile.sm{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:19px;min-height:84px}
.tile.sm .ic{width:34px;height:34px}
.ph{display:grid;place-items:center;text-align:center;height:60%;color:var(--mute);font-size:16px;padding:0 30px;line-height:1.5}
nav{display:flex;justify-content:space-around;padding:10px 4px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-radius:26px 26px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
nav button{background:none;border:0;font:inherit;font-size:14px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;position:relative;min-width:64px;padding:2px 0}
nav button .ic{stroke:var(--mute);width:30px;height:30px}
nav button.on .ic{stroke:var(--green)}
nav button.on .p{background:var(--green);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;margin:-4px 0}
nav button.on .p .ic{stroke:#fff;width:22px;height:22px}
.p{display:grid;place-items:center}
.bd{position:absolute;top:-2px;right:12px;width:12px;height:12px;border-radius:50%;background:#ef4444}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
main.fx{display:flex;flex-direction:column}main.fx>.fl,main.fx>.sc{flex:1 0 auto}
.hd{margin:0 -14px;padding:16px 14px 16px;background:var(--card);border-radius:0 0 26px 26px}
.row{display:flex;align-items:center;gap:12px}
.av{width:48px;height:48px;border-radius:50%;background:#8a919a;display:grid;place-items:center}.av .ic{stroke:#fff;fill:#fff}
.bdg{display:inline-flex;align-items:center;gap:6px;background:var(--green);color:#fff;font-size:14px;padding:3px 10px;border-radius:14px;margin-top:4px}.bdg .ic{stroke:#fff;width:16px;height:16px}
.bal{font-size:40px;font-weight:600;display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px}.bal em{font-style:normal;color:var(--mute);font-size:30px;font-weight:500}.bal .ic{stroke:var(--ink)}
.fk{background:var(--bg);border-radius:26px;padding:22px;font-size:20px;color:var(--mute);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.stories,.qks,.rec,.chs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.stories{margin:14px -14px 0;padding:0 14px}
.story{flex:none;width:150px;height:140px;border-radius:20px;border:3px solid var(--green);color:#fff;font-weight:500;font-size:16px;display:flex;align-items:flex-end;padding:10px;line-height:1.2;cursor:pointer}
.qks{margin:18px -14px 0;padding:0 14px}.qk{flex:none;width:84px;text-align:center;font-size:16px;cursor:pointer}
.qk i{display:grid;place-items:center;height:84px;border-radius:22px;background:var(--card);font-size:40px;font-style:normal;margin-bottom:6px}
.pn{background:var(--bg);box-shadow:0 2px 14px rgba(0,0,0,.08);border:1px solid var(--line);border-radius:26px;margin-top:16px;overflow:hidden}
.ph2{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;font-size:24px;font-weight:600;border-bottom:1px solid var(--line)}
.add{color:var(--green);font-size:20px;font-weight:500;display:flex;align-items:center;gap:6px}.add .ic{stroke:var(--green);width:22px;height:22px}
.cr{display:flex;align-items:center;gap:14px;padding:12px 20px;cursor:pointer}.cr b{display:block;font-size:24px;font-weight:500}.cr small{font-size:17px;color:var(--mute)}.cr .ic{margin-left:auto}
.cd{width:72px;height:50px;border-radius:12px;flex:none;color:#fff;font-weight:700;display:grid;place-items:center;font-size:15px}
.cnt{background:var(--card);border-radius:20px;padding:2px 12px;font-size:20px;margin:0 6px}
.cust{width:100%;border:2px solid var(--ink);border-radius:30px;background:none;color:var(--ink);font:inherit;font-size:21px;padding:18px;margin-top:16px;cursor:pointer}
.inp{background:var(--card);border-radius:26px;padding:22px;font-size:20px;color:var(--mute);display:flex;justify-content:space-between;align-items:center;gap:16px;cursor:pointer}
.inp input{flex:1;min-width:0;border:0;background:none;font:inherit;color:var(--ink);outline:0}.inp .ic{stroke:var(--ink)}
.ban{margin-top:14px;background:#f2300c;color:#fff;border-radius:26px;padding:22px 20px;font-size:19px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.ban i{flex:none;width:46px;height:46px;border-radius:50%;background:var(--green);display:grid;place-items:center;font-style:normal}
.seg{display:flex;border:2px solid var(--line);border-radius:30px;padding:4px;margin:14px 0}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:19px;padding:14px;border-radius:26px;color:var(--mute);cursor:pointer}.seg button.on{background:var(--green);color:#fff}
.rec{margin:0 -14px;padding:4px 14px 12px}

.cir{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
h2{font-size:32px;font-weight:600;margin:22px 0 14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ot{background:var(--card);border-radius:26px;padding:20px;cursor:pointer}.ot b{font-size:22px;font-weight:500;display:block}.ot span{font-size:18px;color:var(--mute);display:block;margin-top:6px;line-height:1.3}
.lg{display:flex;margin-top:14px}.lg i{font-style:normal;font-size:12px;font-weight:700;color:#fff;padding:14px 12px;border-radius:8px;margin-right:-6px}
.ln{display:flex;align-items:center;gap:14px;padding:10px 0;font-size:21px;color:var(--mute);cursor:pointer}.ln i{font-style:normal;width:56px;height:38px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}.ln .fg{background:none;font-size:32px;width:46px}.ln .ic{margin-left:auto}
.cw{background:var(--bg);box-shadow:0 2px 12px rgba(0,0,0,.09);border-radius:22px;padding:10px 14px;display:flex;align-items:center;gap:14px;margin-bottom:10px;cursor:pointer}.cw b{display:block;font-size:20px;font-weight:500}.cw small{font-size:17px;color:var(--mute)}.cw .ic{margin-left:auto}
.hint{color:var(--mute);font-size:17px;padding:10px 6px}
.hdr{display:flex;align-items:center;gap:22px;font-size:24px;font-weight:600;padding:16px 0}.hdr .ic{stroke:var(--ink);cursor:pointer}
.wc{background:var(--bg);box-shadow:0 2px 14px rgba(0,0,0,.09);border:1px solid var(--line);border-radius:26px;padding:14px;display:flex;align-items:center;gap:14px;font-size:20px;font-weight:500}.wc small{display:block;font-size:17px;color:var(--mute);font-weight:400}.wc .ic{margin-left:auto}
.mid{display:grid;place-items:center;height:36px}.mid .ic{stroke:var(--ink);margin:0}
.amb{background:var(--card);border-radius:26px;padding:16px 22px;margin-top:18px}.amb small{font-size:16px;color:var(--mute)}.amb div{font-size:30px;min-height:42px}.amb div.ph0{color:var(--mute);opacity:.8}
.cmn{font-size:16px;color:var(--mute);padding:8px 14px}
.chs{margin:6px -14px;padding:0 14px}.chs button{flex:none;background:none;border:2px solid var(--line);border-radius:30px;padding:12px 20px;font:inherit;font-size:19px;color:var(--ink);cursor:pointer}
.tb{margin-top:10px;border-radius:26px;padding:20px;font-size:20px;font-weight:500;background:linear-gradient(90deg,#b9e4fb,#fbe3ea);color:#111;display:flex;justify-content:space-between;align-items:center}
.fl{display:flex;flex-direction:column;min-height:100%}
.kp{margin:auto -14px -16px;padding:14px 8px;background:var(--sec);display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kp button{height:54px;border-radius:28px;border:0;background:var(--bg);color:var(--ink);font:inherit;font-size:26px;cursor:pointer}.kp .rt{background:rgba(99,102,241,.2);grid-column:4;grid-row:span 2;height:auto}
.dr small{display:block;font-size:17px;color:var(--mute);margin-top:16px}.dr div{font-size:24px}
.okc{width:96px;height:96px;border-radius:50%;background:var(--green);display:grid;place-items:center;margin:26px auto 22px}.okc .ic{stroke:#fff;width:50px;height:50px;stroke-width:3}
.amn{text-align:center;font-size:58px;font-weight:600}.amn em{font-style:normal;font-size:28px;color:var(--mute);font-weight:500}
.pl{display:block;margin:12px auto 0;width:max-content;background:var(--card);padding:10px 20px;border-radius:24px;font-size:17px}
.pill{margin-left:auto;background:rgba(22,163,74,.14);color:var(--green);padding:14px 18px;border-radius:24px;font-size:18px}
.cry{background:var(--card);border-radius:26px;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:22px;font-weight:600;margin-top:20px;line-height:1.2}.cry .btn{font-size:17px;padding:12px 20px;margin-top:12px}
.acts{display:flex;justify-content:center;gap:30px;margin:auto 0 18px;padding-top:20px;text-align:center;font-size:17px}.acts div{cursor:pointer;width:130px}.acts .ic{stroke:var(--ink);width:34px;height:34px;margin-bottom:8px}
.wide{width:100%;font-size:21px;padding:18px}
.sc{margin:0 -14px -16px;min-height:100%;background:#0d1117;color:#fff;display:flex;flex-direction:column;align-items:center;padding:0 24px 40px}.sc .hdr{align-self:stretch}.sc .hdr .ic{stroke:#fff}
.vf{width:230px;height:230px;margin:50px 0 24px;position:relative;border-radius:24px;border:3px solid var(--green);overflow:hidden;background:repeating-conic-gradient(#1b222c 0 25%,#151b23 0 50%) 0 0/30px 30px}
.vf::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--green);box-shadow:0 0 12px var(--green);animation:sl 2s linear infinite alternate}
@keyframes sl{from{top:0}to{top:calc(100% - 3px)}}
.sc p{color:#aab2bd;text-align:center;font-size:16px;margin-bottom:26px;line-height:1.45}

const mask=d=>d.slice(0,4)+' '+d.slice(4,6)+'** **** '+d.slice(12);
const com=()=>R.k==='uzqr'?0:Math.round(+am*0.009);
const SRC=()=>cd('#1db954','paynet')+`<div>Paynet karta • 8218<small>${fmt(bal.p)} soʻm</small></div>${ic('ch')}`;
const RCP=r=>r.k==='uzqr'?`<div class="cd" style="background:#0b2d8c;border-radius:50%;width:56px;height:56px">${r.logo||'UzQR'}</div><div>${r.name}<small>${r.sub}</small></div>`:`${cd(r.c[0],r.c[1])}<div>${r.name}<small>${r.sub}</small></div>${ic('ch')}`;
const pair=a=>`<div class="wc">${SRC()}</div><div class="mid ${a}">${ic(a)}</div><div class="wc">${RCP(R)}</div>`;

function home(){
 const bl=hide?'••••••':fmt(bal.p+bal.h),hb=hide?'••••':null;
 const sty=[['linear-gradient(160deg,#ff9a3c,#2d7ff9)','eSIM'],['linear-gradient(160deg,#f05a5a,#7bd88f)','Xitoyga pul oʻtkazmalari'],['linear-gradient(160deg,#e8742b,#a33a14)','Komissiyasiz oʻtkazmalar'],['linear-gradient(160deg,#caa46a,#6b4a22)','Inson uchun']];
 const qk=[['▦','QR','scan'],['👛','Keshbek',''],['🪙','Tangalar',''],['🔄','Xolis',''],['₿','Kripto','']];
 return `<div class="hd"><div class="row"><div class="av">${ic('user')}</div><div style="flex:1"><b style="font-size:24px;font-weight:600">Muhammadyusuf ›</b><br><span class="bdg">${ic('shield')}Himoyalangan</span></div>${ic('chat')}</div>
<div style="margin-top:20px;color:var(--mute);font-size:18px">≡ Umumiy balans</div>
<div class="bal"><span>${bl} <em>soʻm</em></span><span data-a="eye" style="cursor:pointer">${ic(hide?'eyo':'eye')}</span></div>
<div class="fk" data-a="search">Kartaga oʻtkazma ${ic('book')}</div>
<div class="stories">${sty.map(s=>`<div class="story" style="background:${s[0]}">${s[1]}</div>`).join('')}</div></div>
<div class="qks">${qk.map(q=>`<div class="qk" ${q[2]?`data-a="${q[2]}"`:''}><i>${q[0]}</i>${q[1]}</div>`).join('')}</div>
<div class="pn"><div class="ph2"><span>Kartalarim <span class="cnt">2</span>›</span><span class="add">${ic('plus')}Qoʻshish</span></div>
<div class="cr">${cd('#1db954','paynet')}<div><b>${hb||fmt(bal.p)} soʻm</b><small>• 8218 Paynet karta</small></div>${ic('ch')}</div>
<div class="cr">${cd('#0aa3b5','H')}<div><b>${hb||fmt(bal.h)} soʻm</b><small>• 7321 Smart Bank</small></div>${ic('ch')}</div></div>
<div class="pn"><div class="ph2"><span>Mening uylarim ›</span><span class="add">${ic('plus')}Qoʻshish</span></div>
<div class="cr"><b>Mening uyim</b>${ic('ch')}</div>
<div class="cr"><div class="cir" style="background:#e9edf1;font-size:22px">📱</div><div><b style="font-size:20px">Uyali aloqa</b><small>973352787</small></div><div style="margin-left:auto;text-align:right"><b style="font-size:20px">0 soʻm</b><small>Oxirgi toʻlov</small></div></div></div>
<button class="cust">⚙ Asosiy ekranni sozlash</button>`}

function otk(){
 const rc=i=>`<div class="rc" data-a="pick" data-v="${i}"><div class="cir" style="background:${cards[i][2]}">${cards[i][3][0]}</div>${cards[i][1]}</div>`;
 const rec=ot?(tpl.length?tpl.map((t,i)=>`<div class="rc" data-a="tplgo" data-v="${i}"><div class="cir" style="background:${t.c[0]}">${t.name[0]}</div>${t.name}</div>`).join(''):`<p class="hint">Shablonlar yoʻq. Oʻtkazmadan keyin «Shablonga qoʻshish» tugmasini bosing.</p>`):[1,2,0].map(rc).join('');
 const ln=(i,c,t)=>`<div class="ln" data-a="search" data-v="0"><i style="background:${c}">${i}</i>${t}${ic('ch')}</div>`;
 const fl=(f,t)=>`<div class="ln"><i class="fg">${f}</i>${t}${ic('ch')}</div>`;
 return `<h1>Oʻtkazmalar</h1>
<div class="inp" data-a="search"><span>Karta yoki telefon</span><span style="display:flex;gap:16px">${ic('book')}<span data-a="scan">${ic('scan')}</span></span></div>
<div class="ban"><span>Koreyaga oʻtkazmalar uchun 0 soʻm komissiya</span><i>${ic('ch').replace('class="ic"','class="ic" style="stroke:#fff"')}</i></div>
<div class="seg"><button class="${ot?'':'on'}" data-a="ot" data-v="0">Oxirgi</button><button class="${ot?'on':''}" data-a="ot" data-v="1">Shablon boʻyicha</button></div>
<div class="rec">${rec}</div>
<h2>Oʻtkazish</h2>
<div class="g2"><div class="ot" data-a="search" data-v="1"><b>Oʻz kartalarimga</b><span>Paynet-karta, Humo, Uzcard</span><div class="lg"><i style="background:#f29a1d">HUMO</i><i style="background:#1c2c6b">U</i><i style="background:#1db954">paynet</i></div></div>
<div class="ot"><b>ATTO kartaga</b><span>Avtobus, metro</span><div class="lg"><i style="background:#2b2f9e">ATTO</i></div></div></div>
<div class="ot" style="margin-top:12px"><b>Visa Direct, Moneysend</b>${ln('VISA','#2236c9','Visa kartaga')}${ln('MC','#0d2f5e','Mastercard kartaga')}</div>
<div class="ot" style="margin-top:12px;display:flex;justify-content:space-between;align-items:center"><div><b>Xalqaro pul oʻtkazmalari</b><span>200 dan ortiq mamlakat</span></div><span style="font-size:60px;margin:0">🌍</span></div>
<div class="ot" style="margin-top:12px"><b>Boshqa mamlakatlarga</b>${[['🇷🇺','Rossiya'],['🇰🇷','Koreya'],['🇨🇳','Xitoy'],['🇹🇷','Turkiya'],['🇹🇯','Tojikiston'],['🇰🇬','Qirgʻiziston']].map(c=>fl(c[0],c[1])).join('')}</div>`}

function res(){
 if(!qs)return (st?[0,4]:[0,1,2,3,4]).map(i=>`<div class="cw" data-a="pick" data-v="${i}">${cd(cards[i][2],cards[i][3])}<div><b>${cards[i][0]}</b><small>${cards[i][1]}</small></div>${ic('ch')}</div>`).join('');
 if(qs.length===9||(qs.length===12&&qs.startsWith('998'))){const p=qs.slice(-9);return `<div class="cw" data-a="pickp">${cd('#3b82f6','☎')}<div><b>+998 ${p.slice(0,2)} ${p.slice(2,5)} ${p.slice(5,7)} ${p.slice(7)}</b><small>${look(qs)}</small></div>${ic('ch')}</div>`}
 if(qs.length<16)return `<p class="hint">Karta raqamini toʻliq kiriting (${qs.length}/16)</p>`;
 const b=bc(qs);
 return `<div class="cw">${cd(b[0],b[1])}<div><b>${mask(qs)}</b><small>Karta raqami</small></div></div><div class="inp" style="cursor:text;margin-top:12px"><input id="nm" placeholder="Ism familiya" autocapitalize="words" value="${NM}"></div><button class="btn wide" data-a="pickq" style="margin-top:14px">Davom etish</button>`}
function search(){
 return `<div class="hdr"><span data-a="back">${ic('bk')}</span>Oʻtkazmalar</div>
<div class="inp" style="cursor:text"><input id="q" inputmode="numeric" placeholder="Karta yoki telefon" value="${qs.replace(/(.{4})/g,'$1 ').trim()}"><span style="display:flex;gap:16px">${ic('book')}<span data-a="scan">${ic('scan')}</span></span></div>
<div class="seg"><button class="${st?'':'on'}" data-a="st" data-v="0">Soʻnggi</button><button class="${st?'on':''}" data-a="st" data-v="1">Kartalarim</button></div>
<div id="res">${res()}</div>`}

function updAmt(){
 const a=document.getElementById('amt'),q=R.k==='uzqr';
 if(am){a.className='';a.textContent=fmt(am)}else{a.className='ph0';a.textContent=q?'100 - 44 000 000':'1 000 - 44 000 000'}
 document.getElementById('cm').textContent='Komissiya '+(q?'0.0':'0.9')+'%'}
function amount(){
 const q=R.k==='uzqr',key=(v,c='')=>`<button class="${c}" data-a="k" data-v="${v}">${c?(v==='b'?'⌫':'✓'):v}</button>`;
 return `<div class="fl"><div class="hdr"><span data-a="back">${ic('bk')}</span>${q?(R.l4==='QR'?'QR orqali toʻlov':'Toʻlov'):'Kartaga oʻtkazish'}</div>${pair('dn')}
<div class="amb"><small>Siz ${q?'toʻlayapsiz':'oʻtkazyapsiz'}</small><div id="amt"></div></div><div class="cmn" id="cm"></div>
<div class="chs">${[50000,100000,200000,500000].map(v=>`<button data-a="chip" data-v="${v}">${fmt(v)}</button>`).join('')}</div>
${q?'':`<div class="tb">Tabriknoma qoʻshing<span class="add">${ic('plus')}</span></div>`}
<div class="kp"><div class="kt"><span>${ic('grid')}</span><span>🎤</span></div>${['1','2','3'].map(v=>key(v)).join('')}<button class="rt" data-a="nop">–</button>${['4','5','6'].map(v=>key(v)).join('')}<button class="rt" data-a="nop">␣</button>${['7','8','9'].map(v=>key(v)).join('')}${key('b','rt')}<button data-a="nop">,</button>${key('0')}<button data-a="nop">.</button>${key('ok','rt')}</div></div>`}
function cnf(){
 const q=R.k==='uzqr',c=com(),a=+am;
 return `<div class="fl"><div class="hdr"><span data-a="back">${ic('bk')}</span>${q?'Toʻlovni tasdiqlash':'Oʻtkazmani tasdiqlash'}</div>${pair('dd')}
<div class="dr" style="border-top:1px solid var(--line);margin-top:22px"><small>Siz ${q?'toʻlayapsiz':'oʻtkazyapsiz'}</small><div>${fmt(a)} soʻm</div><small>Komissiya</small><div>${c} soʻm</div><small>Kartadan yechib olinadi</small><div>${fmt(a+c)} soʻm</div></div>
<p style="margin-top:auto;text-align:center;color:var(--mute);padding:20px 0 14px">Komissiya ${q?'0.0':'0.9'}%</p><button class="btn wide" data-a="send">${q?'Toʻlash':'Oʻtkazish'}</button></div>`}
function done(){
 const r=last.R,q=r.k==='uzqr';
 return `<div class="fl"><div class="hdr" style="justify-content:center;font-weight:500">${q?'Toʻlov amalga oshirildi':'Oʻtkazma yuborildi'}</div>
<div class="okc">${ic('ck')}</div><div class="amn">${fmt(last.a)} <em>soʻm</em></div>${q?'':`<span class="pl">Komissiya ${last.c} soʻm</span>`}
<div class="wc" style="margin-top:26px">${q?RCP(r).split('<div>')[0]:cd(r.c[0],r.c[1])}<div><small>${r.name}</small>${q?r.sub:'• '+r.l4}</div><span class="pill">Bajarildi</span></div>
${q?'':`<div class="cry"><div>Qonuniy kripto-hamyonni oching<br><button class="btn">Sinab koʻrish ›</button></div><span style="font-size:56px">🪙</span></div>`}
<div class="acts"><div ${q?'':'data-a="tpl"'}>${ic('star')}<br>Shablonga qoʻshish</div><div data-a="tdet">${ic('doc')}<br>Oʻtkazma tafsilotlari</div></div>
<button class="btn wide" data-a="done">Tayyor</button></div>`}
function scan(){
 return `<div class="sc"><div class="hdr"><span data-a="back">${ic('bk')}</span>QR skaner</div><div class="vf"></div><p>Istalgan QR-kodni ramka ichiga joylashtiring. Karta raqami yoki ism soʻralmaydi, faqat UzQR koʻrsatiladi.</p><button class="btn" data-a="scanok">Skanerlash</button></div>`}
const SC={search,amount,confirm:cnf,done,scan};

function ok(){
 const a=+am,mn=R.k==='uzqr'?100:1000;
 if(a<mn)return toast('Minimal summa '+fmt(mn)+' soʻm');
 if(a>44000000)return toast('Maksimal summa 44 000 000 soʻm');
 if(a+com()>bal.p)return toast('Kartada mablagʻ yetarli emas');
 scr={n:'confirm'};render()}
function act(a,v){
 if(a==='eye'){hide=!hide;render()}
 else if(a==='search'){scr={n:'search'};tab=1;qs='';NM='';st=+v||0;render();const q=document.getElementById('q');q&&q.focus()}
 else if(a==='st'){st=+v;render();const q=document.getElementById('q');q&&q.focus()}
 else if(a==='ot'){ot=+v;render()}
 else if(a==='back'){const n=scr&&scr.n;scr=n==='confirm'?{n:'amount'}:n==='amount'?(R.k==='uzqr'?(R.l4==='QR'?{n:'scan'}:{n:'svp'}):{n:'search'}):null;render()}
 else if(a==='pick'){const c=cards[+v];R={k:'card',name:c[1].toUpperCase(),sub:c[0],l4:c[0].slice(-4),c:[c[2],c[3]]};am='';scr={n:'amount'};render()}
 else if(a==='pickp'){const p=qs.slice(-9);R={k:'card',name:look(qs),sub:'+998 '+p.slice(0,2)+' '+p.slice(2,5)+' '+p.slice(5,7)+' '+p.slice(7),l4:p.slice(-4),c:['#3b82f6','☎']};am='';scr={n:'amount'};render()}
 else if(a==='rcp'){scr={n:'rcp',x:HR[+v]};render()}
 else if(a==='svc'){SVN=v;SP=0;SNUM='';scr={n:'svp'};render()}
 else if(a==='sp'){SP=+v;render()}
 else if(a==='svcgo'){if(!SNUM.trim())return toast('Raqamni kiriting');const pv=sv(SVN)[1][SP];R={k:'uzqr',name:pv,sub:SNUM,l4:'SV',logo:pv.slice(0,2).toUpperCase()};am='';scr={n:'amount'};render()}
 else if(a==='pickq'){if(!NM.trim())return toast('Ism familiyani kiriting');R={k:'card',name:NM.trim().toUpperCase(),sub:mask(qs),l4:qs.slice(-4),c:bc(qs)};am='';scr={n:'amount'};render()}
 else if(a==='tplgo'){R=tpl[+v];am='';scr={n:'amount'};render()}
 else if(a==='scan'){scr={n:'scan'};render()}
 else if(a==='scanok'){toast('QR-kod oʻqildi');R={k:'uzqr',name:'UzQR',sub:'QR orqali toʻlov',l4:'QR'};am='';scr={n:'amount'};render()}
 else if(a==='chip'){am=String(v);updAmt()}
 else if(a==='k'){if(v==='ok')return ok();if(v==='b')am=am.slice(0,-1);else if(am&&(am+v).length<=8)am+=v;else if(!am&&v[0]!=='0')am=v;updAmt()}
 else if(a==='send'){
  const x=+am,c=com(),d=new Date(),hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  spent+=x+c;
  if(out[0][0]==='Bugun')out[0][0]='';out.unshift(['Bugun',R.name,R.k==='uzqr'?(R.l4==='QR'?'UzQR':R.name)+' •8218':'Chiquvchi oʻtkazma •8218','−'+fmt(x+c),hm,R.l4==='QR'?'q':'o']);
  last={R,a:x,c};SAVED.push([new Date().toLocaleDateString('sv'),out[0][1],out[0][2],out[0][3],out[0][4],out[0][5]]);persist();scr={n:'done'};render()}
 else if(a==='tpl'){if(!tpl.some(t=>t.l4===R.l4))tpl.push(R);persist();toast('Shablonga qoʻshildi')}
 else if(a==='tdet')toast();
 else if(a==='done'){scr=null;tab=0;render()}}
document.addEventListener('input',e=>{if(e.target.id==='nm'){NM=e.target.value;return}if(e.target.id==='sn'){SNUM=e.target.value;return}if(e.target.id!=='q')return;const d=e.target.value.replace(/\D/g,'').slice(0,16);qs=d;e.target.value=d.replace(/(.{4})/g,'$1 ').trim();document.getElementById('res').innerHTML=res()});
let HR=[],CUR='',SVN='',SP=0,SNUM='',CAM=null,NM='';
const SV={'Mobil aloqa':['Telefon raqami',['Ucell','Beeline','Uzmobile','Mobiuz']],'Internet va TV':['Abonent raqami',['Uztelecom','Sarkor','EVO','Comnet']],'Kommunal':['Shaxsiy hisob raqami',['Elektr energiya','Tabiiy gaz','Suv','Chiqindi']],'Davlat':['Hisob yoki jarima raqami',['YHXB jarimalari','Soliq','Davlat boji']],'Talim':['Talaba yoki shartnoma raqami',['Universitet','Maktab','Kurslar']]};
const sv=v=>{const k=Object.keys(SV).find(k=>k.slice(0,2)===v.slice(0,2));return SV[k]||['Hisob raqami',[v]]};
function svp(){const c=sv(SVN);
 return `<div class="hdr"><span data-a="back">${ic('bk')}</span>${SVN}</div>
<div class="seg" style="flex-wrap:wrap;border-radius:26px">${c[1].map((p,i)=>`<button class="${i===SP?'on':''}" data-a="sp" data-v="${i}">${p}</button>`).join('')}</div>
<div class="inp" style="cursor:text"><input id="sn" placeholder="${c[0]}" value="${SNUM}"></div><p class="hint">${c[0]}ni kiriting</p>
<button class="btn wide" data-a="svcgo">Davom etish</button>`}
function rcpt(){const r=scr.x[0],d=scr.x[1],inc=r[3][0]==='+',id=(r[4]+d).replace(/\D/g,'').padEnd(10,'7').slice(0,10);
 const row=(a,b)=>`<div class="dr"><small>${a}</small><div>${b}</div></div>`;
 return `<div class="hdr"><span data-a="back">${ic('bk')}</span>Operatsiya tafsilotlari</div>
<div class="okc" style="margin:14px auto 18px;background:${inc?'var(--green)':'#0b2d8c'};font-size:34px;color:#fff">${inc?'↙':'↗'}</div>
<div class="amn ${inc?'pos':''}" style="font-size:42px">${r[3]} <em>soʻm</em></div><span class="pl" style="color:var(--green)">Bajarildi</span>
<div style="margin-top:20px;border-top:1px solid var(--line)">${row(inc?'Yuboruvchi':'Oluvchi',r[1])}${row('Turi',r[2])}${row('Sana va vaqt',(d||'Bugun')+', '+r[4])}${row('Chek raqami','№ '+id)}</div>`}
SC.svp=svp;SC.rcp=rcpt;
async function startCam(){
 try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  if(!(scr&&scr.n==='scan')){s.getTracks().forEach(t=>t.stop());return}
  CAM=s;const vf=document.querySelector('.vf'),v=document.createElement('video');
  v.srcObject=s;v.muted=true;v.setAttribute('playsinline','');v.style.cssText='width:100%;height:100%;object-fit:cover';vf.appendChild(v);await v.play();
  if('BarcodeDetector' in window){const bd=new BarcodeDetector({formats:['qr_code']});
   const tick=async()=>{if(!CAM)return;try{const r=await bd.detect(v);if(r.length){act('scanok');return}}catch(e){}setTimeout(tick,300)};tick()}
 }catch(e){}}
const SK='paynet_maket_v3',SAVED=[],MN=['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
function persist(){try{localStorage.setItem(SK,JSON.stringify({p:bal.p,h:bal.h,s:spent,r:SAVED,t:tpl}))}catch(e){}}
(function(){try{const d=JSON.parse(localStorage.getItem(SK)||'null');if(!d)return;
 bal.p=d.p;bal.h=d.h;spent=d.s||0;(d.t||[]).forEach(t=>tpl.push(t));(d.r||[]).forEach(r=>SAVED.push(r));
 const t0=new Date().toDateString();let prev='';
 const rows=[...SAVED].reverse().map(r=>{const dt=new Date(r[0]+'T00:00'),l=dt.toDateString()===t0?'Bugun':dt.getDate()+'-'+MN[dt.getMonth()],h=l!==prev?l:'';prev=l;return [h,r[1],r[2],r[3],r[4],r[5]]});
 if(prev==='Bugun')out[0][0]='';out.unshift(...rows)}catch(e){}})();
const ph=n=>n[0]==='A'?home():n[0]==='O'?otk():`<h1>${n}</h1><div class="ph">Bu ekran skrinshotlarda yoʻq edi. Uning skrinshotini yuborsangiz, qoʻshib beraman.</div>`;

function render(){
 const v=document.getElementById('v');
 v.innerHTML=[ph('Asosiy'),ph('Oʻtkazmalar'),pay(),hist(),svc()][tab];
 if(scr)v.innerHTML=SC[scr.n]();v.className=scr?'fx':'';if(scr&&scr.n==='amount')updAmt();if(CAM&&!(scr&&scr.n==='scan')){CAM.getTracks().forEach(t=>t.stop());CAM=null}if(scr&&scr.n==='scan')startCam();v.scrollTop=0;document.getElementById('nav').style.display=scr&&NONAV.includes(scr.n)?'none':'flex';
 document.getElementById('nav').innerHTML=tabs.map((t,i)=>`<button class="${i===tab?'on':''}" data-t="${i}"><span class="p">${ic(t[0])}</span>${t[1]}${i===4?'<span class="bd"></span>':''}</button>`).join('');
}
let tm;
function toast(m){const e=document.getElementById('toast');e.textContent=m||'Bu maket: amal bajarilmaydi';e.classList.add('show');clearTimeout(tm);tm=setTimeout(()=>e.classList.remove('show'),1400)}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-t]'),f=e.target.closest('[data-f]');
 const ac=e.target.closest('[data-a]');if(ac){act(ac.dataset.a,ac.dataset.v);return}if(t){scr=null;tab=+t.dataset.t;render()}
 else if(f){flt=f.dataset.f;const s=document.getElementById('v').scrollTop;render();document.getElementById('v').scrollTop=s}
 else if(e.target.closest('.btn,.svc,.tile,.tx,.ot,.story,.qk,.cr,.cust,.fk,.ban,.rc,.ln'))toast();
});
render();
</script>
</body>
</html>
